<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" href="data:,">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Darkwood Forest — Dressed Graybox (feel pass)</title>
  <style>
    :root {
      --bg: #1a1f16;
      --panel: rgba(12, 16, 10, 0.88);
      --text: #e8f0d8;
      --muted: #a8b890;
      --accent: #c8e08a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #game {
      display: block;
      width: 100%;
      height: 100%;
      background: #0c100a;
    }
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }
    #hud .panel {
      pointer-events: auto;
      background: var(--panel);
      border: 1px solid rgba(200, 224, 138, 0.25);
      border-radius: 10px;
      padding: 10px 12px;
      backdrop-filter: blur(6px);
    }
    #topbar {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-start;
    }
    #stats { flex: 1 1 180px; min-width: 160px; }
    #stats .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 14px;
      line-height: 1.45;
    }
    #stats .label { color: var(--muted); }
    #stats .value { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--accent); }
    #stats .landmark { color: #fff; font-weight: 600; }
    #controls-hint {
      flex: 0 1 240px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4;
    }
    #controls-hint strong { color: var(--text); }
    #btn-reset {
      pointer-events: auto;
      border: 1px solid rgba(200, 224, 138, 0.4);
      background: #2a3520;
      color: var(--accent);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-start;
    }
    #btn-reset:active { background: #3a4a2c; }
    #script {
      position: absolute;
      bottom: 12px;
      left: 10px;
      right: 10px;
      max-width: 520px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
    }
    #script h3 {
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 4px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    #script ol { margin-left: 18px; }
    #script li.done { color: #7ec87e; text-decoration: line-through; }
    #script li.current { color: #fff; font-weight: 600; }
    #touch {
      position: fixed; left: 0; top: 0;
      width: 120px; height: 120px; margin: -60px 0 0 -60px;
      pointer-events: none; display: none; z-index: 5;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
    }
    #touch.on { display: block; }
    #touch-knob {
      position: absolute; width: 48px; height: 48px; border-radius: 50%;
      background: rgba(200, 224, 138, 0.45);
      border: 1px solid rgba(200, 224, 138, 0.7);
      left: 36px; top: 36px;
    }
    #touch-hint {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      font: 600 11px system-ui, sans-serif; color: rgba(255,255,255,0.45);
      pointer-events: none; display: none;
    }
    @media (pointer: coarse) {
      #touch-hint { display: block; }
      #script { right: 150px; max-width: 360px; bottom: 126px; padding: 6px 10px; }
      #script li:not(.current) { display: none; }
    }
    #title {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(232, 240, 216, 0.55);
      pointer-events: none;
      white-space: nowrap;
    }
    #load {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0c100a;
      color: var(--accent);
      font-size: 14px;
      letter-spacing: 0.04em;
    }
    #load.hide { display: none; }
    .label3d {
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(8,10,6,0.78);
      border: 1px solid rgba(200,224,138,0.28);
      color: #f2f6e8;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      transform: translate(-50%, -100%);
      pointer-events: none;
      user-select: none;
    }
    #minimap {
      position: absolute;
      right: calc(10px + env(safe-area-inset-right));
      bottom: calc(10px + env(safe-area-inset-bottom));
      width: 110px; height: 110px;
      border-radius: 8px;
      border: 1px solid rgba(200,224,138,0.35);
      background: rgba(10,14,8,0.75);
      pointer-events: auto;
    }
    .hpbar { width: 44px; height: 5px; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.35); border-radius: 3px; transform: translate(-50%,-100%); pointer-events: none; }
    .podcount { font: 600 10px system-ui, sans-serif; color: rgba(230,225,200,0.75); background: rgba(0,0,0,0.4); padding: 1px 5px; border-radius: 8px; pointer-events: none; white-space: nowrap; }
    .hpbar i { display: block; height: 100%; width: 100%; background: #e04a3a; border-radius: 2px; }
    .ftxt { font: 700 14px system-ui, sans-serif; color: #fff; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: nowrap; transform: translate(-50%,-100%); }
    .ftxt.dmg { color: #ffe08a; }
    .ftxt.gain { color: #7dff8c; font-size: 15px; }
    .ftxt.gain.boss { font-size: 24px; color: #a8ffb2; }
    #combat { position: absolute; left: calc(12px + env(safe-area-inset-left)); bottom: calc(12px + env(safe-area-inset-bottom)); pointer-events: auto; }
    #combat button { font: 600 13px system-ui, sans-serif; color: var(--text); background: rgba(20,28,16,0.85); border: 1px solid rgba(200,224,138,0.45); border-radius: 8px; padding: 6px 10px; font-size: 12px; touch-action: manipulation; }
    #pstats { position: absolute; left: calc(12px + env(safe-area-inset-left)); bottom: calc(50px + env(safe-area-inset-bottom)); max-width: calc(100vw - 150px); white-space: normal; font: 600 11px system-ui, sans-serif; color: #c8f0b0; background: rgba(8,10,6,0.7); padding: 4px 8px; border-radius: 6px; pointer-events: none; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
  <div id="load">Loading Darkwood dress…</div>
  <canvas id="game"></canvas>
  <div id="hud">
    <div id="title">The Darkwood Forest — Dressed Graybox (feel)</div>
    <div id="topbar">
      <div class="panel" id="stats">
        <div class="row"><span class="label">Elapsed</span><span class="value" id="timer">0.0s</span></div>
        <div class="row"><span class="label">Nearest</span><span class="landmark" id="nearest">—</span></div>
        <div class="row"><span class="label">N–S tip</span><span class="value" id="crosshint">~50s target</span></div>
      </div>
        <button type="button" id="btn-reset">Reset timer</button>
    </div>
    <div id="touch" aria-hidden="true">
      <div id="touch-knob"></div>
    </div>
    <div id="pstats"></div>
    <div id="combat">
      <button type="button" id="btn-boss">Boss test</button>
    </div>
    <canvas id="minimap" width="220" height="220"></canvas>
  </div>
  <script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";
import { RGBELoader } from "three/addons/loaders/RGBELoader.js";
import * as SkeletonUtils from "three/addons/utils/SkeletonUtils.js";

const WORLD = 220;
const HALF = WORLD / 2;
const LAKE_R = 28;
const RING_R = 42;
const ROAD_W = 7;
const CARDINAL_HALF_W = 5.5;
const PLATFORM_R = 14;
const BRIDGE_W = 6;
const WALL_THICK = 4;
// Design lock: north fire wall. World +Y = south (same as 2b). North = -Y.
const WALL_Y = -(HALF - 6);
const WALK_SPEED = 7.7; // 2x base (was 3.85)
const PLAYER_R = 1.15;

const canvas = document.getElementById("game");
const timerEl = document.getElementById("timer");
const nearestEl = document.getElementById("nearest");
const crossHintEl = document.getElementById("crosshint");
const btnReset = document.getElementById("btn-reset");
const scriptItems = [...document.querySelectorAll("#script-list li")];
const touchPad = document.getElementById("touch");
const touchKnob = document.getElementById("touch-knob");
const loadEl = document.getElementById("load");
const minimap = document.getElementById("minimap");
const mctx = minimap.getContext("2d");

crossHintEl.textContent = (WORLD / WALK_SPEED).toFixed(0) + "s N–S @ walk";

const landmarks = [
  { id: "shack", label: "Shack / Spawn", x: 0, y: HALF - 10, r: 8 },
  { id: "legendary", label: "Legendary", x: -HALF * 0.62, y: HALF * 0.55, r: 10 },
  { id: "spirit", label: "Dark spirit", x: HALF * 0.58, y: -HALF * 0.52, r: 10 },
  { id: "boss", label: "Bandit boss", x: 0, y: 0, r: PLATFORM_R + 2 },
  { id: "wall", label: "Fire-curse wall (exit stub)", x: 0, y: WALL_Y + 2, r: 12 }
];

const progress = {
  ringLap: false, visitedLegendary: false, visitedSpirit: false,
  bridgeE: false, bridgeW: false, onPlatform: false, hitWall: false, returned: false
};
let ringAngleAccum = 0;
let lastRingAngle = null;

const keys = Object.create(null);
let touchVec = { x: 0, y: 0 };
let touchActive = false;
const player = { x: 0, y: HALF - 10, onPlatform: false, facing: 0 };
let elapsed = 0;
let lastTs = 0;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = "fixed";
labelRenderer.domElement.style.inset = "0";
labelRenderer.domElement.style.pointerEvents = "none";
labelRenderer.domElement.style.zIndex = "5";
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c100a);
scene.fog = new THREE.FogExp2(0x1a2214, 0.012);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.5, 320);
const camOffset = new THREE.Vector3(28, 38, 28); // overhead isometric-ish

const hemi = new THREE.HemisphereLight(0xc8d8a8, 0x2a1a10, 0.85);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe2b0, 1.15);
sun.position.set(40, 70, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 10;
sun.shadow.camera.far = 220;
sun.shadow.camera.left = -90;
sun.shadow.camera.right = 90;
sun.shadow.camera.top = 90;
sun.shadow.camera.bottom = -90;
scene.add(sun);

const fireLight = new THREE.PointLight(0xff6622, 2.2, 55, 2);
fireLight.position.set(0, 6, WALL_Y);
scene.add(fireLight);
const spiritLight = new THREE.PointLight(0x8866ff, 1.4, 28, 2);
spiritLight.position.set(landmarks[2].x, 5, landmarks[2].y);
scene.add(spiritLight);

function mulberry32(a) {
  return function () {
    let t = (a += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(0xda24);

function makeLabel(text, color) {
  const el = document.createElement("div");
  el.className = "label3d";
  el.textContent = text;
  if (color) el.style.color = color;
  return new CSS2DObject(el);
}


// ---- CC0 ground textures (Poly Haven) ----
const texLoader = new THREE.TextureLoader();
const MAX_ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());
function loadTex(path, srgb, rep) {
  const t = texLoader.load(path);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = MAX_ANISO;
  t.generateMipmaps = true;
  t.minFilter = THREE.LinearMipmapLinearFilter;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (rep) t.repeat.set(rep, rep);
  return t;
}
function pbrSet(name, rep) {
  const b = "models/textures/" + name + "/";
  return {
    map: loadTex(b + "color.jpg", true, rep),
    normalMap: loadTex(b + "normal.jpg", false, rep),
    roughnessMap: loadTex(b + "roughness.jpg", false, rep)
  };
}
// world-space planar UVs (1 tile per `tile` meters) on an XZ geometry
function worldUV(geo, tile) {
  const p = geo.attributes.position, uv = new Float32Array(p.count * 2);
  for (let i = 0; i < p.count; i++) { uv[i * 2] = p.getX(i) / tile; uv[i * 2 + 1] = p.getZ(i) / tile; }
  geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
}
// soft-edge alpha strip (fades toward v=0 and v=1 edges)
function edgeFadeTex() {
  const c = document.createElement("canvas"); c.width = 4; c.height = 64;
  const g = c.getContext("2d"), gr = g.createLinearGradient(0, 0, 0, 64);
  gr.addColorStop(0, "#000"); gr.addColorStop(0.3, "#fff"); gr.addColorStop(0.7, "#fff"); gr.addColorStop(1, "#000");
  g.fillStyle = gr; g.fillRect(0, 0, 4, 64);
  return new THREE.CanvasTexture(c);
}
const TEX = {};
function initTextures() {
  TEX.grass = pbrSet("grass", 1);
  TEX.dirt = pbrSet("dirt", 1);
}

function addGround() {
  initTextures();
  const geo = new THREE.PlaneGeometry(WORLD, WORLD, 40, 40);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    let r = 0.22, g = 0.30, b = 0.16;
    if (x < -RING_R * 0.2) { r *= 0.7; g *= 1.05; b *= 0.75; } // denser W
    if (z > RING_R * 0.2) { r *= 0.75; g *= 1.0; b *= 0.7; } // denser S
    if (x > RING_R * 0.15 && z < 0) { r = 0.32; g = 0.20; b = 0.12; } // E/NE ash
    if (z < -HALF * 0.55) { r = 0.38; g = 0.18; b = 0.10; } // near fire wall
    // vertex color now a tint over the grass texture (base grass ≈ white-ish green)
    colors[i * 3] = Math.min(1, r * 4.0); colors[i * 3 + 1] = Math.min(1, g * 3.3); colors[i * 3 + 2] = Math.min(1, b * 4.2);
  }
  worldUV(geo, 6);
  geo.setAttribute("color", new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1, metalness: 0, ...TEX.grass, normalScale: new THREE.Vector2(0.6, 0.6) });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = true;
  scene.add(mesh);

  // soft border
  const edge = new THREE.Mesh(
    new THREE.BoxGeometry(WORLD + 2, 2, WORLD + 2),
    new THREE.MeshStandardMaterial({ color: 0x0a0e08, roughness: true, opacity: 0.0 })
  );
  edge.position.y = -1.2;
  scene.add(edge);
}

function roadMat(opts = {}) {
  return new THREE.MeshStandardMaterial({ ...TEX.dirt, color: 0xd8c4a8, roughness: 1, normalScale: new THREE.Vector2(0.7, 0.7), ...opts });
}
function ringRoadMesh() {
  // core dirt ring + soft feathered shoulder (alpha fades across the width)
  const core = new THREE.RingGeometry(RING_R - ROAD_W / 2, RING_R + ROAD_W / 2, 96, 1);
  core.rotateX(-Math.PI / 2); worldUV(core, 5);
  const mesh = new THREE.Mesh(core, roadMat());
  mesh.position.y = 0.04; mesh.receiveShadow = true; scene.add(mesh);
  const sh = new THREE.RingGeometry(RING_R - ROAD_W / 2 - 1.6, RING_R + ROAD_W / 2 + 1.6, 96, 1);
  // uv2-style: alpha uses radial v; map uses world uv via custom attribute swap
  const p = sh.attributes.position, a = new Float32Array(p.count * 2), w = new Float32Array(p.count * 2);
  const r0 = RING_R - ROAD_W / 2 - 1.6, r1 = RING_R + ROAD_W / 2 + 1.6;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), r = Math.hypot(x, y);
    a[i * 2] = 0.5; a[i * 2 + 1] = (r - r0) / (r1 - r0);
    w[i * 2] = x / 5; w[i * 2 + 1] = -y / 5;
  }
  sh.setAttribute("uv", new THREE.BufferAttribute(w, 2));
  sh.setAttribute("uv1", new THREE.BufferAttribute(a, 2));
  sh.rotateX(-Math.PI / 2);
  const fade = edgeFadeTex(); fade.channel = 1;
  const shm = new THREE.Mesh(sh, roadMat({ alphaMap: fade, transparent: true, depthWrite: false, opacity: 0.85 }));
  shm.position.y = 0.035; shm.receiveShadow = true; scene.add(shm);
}

function cardinalRoads() {
  const mat = roadMat();
  const outer = HALF - 2;
  const spokeLen = outer - (RING_R - ROAD_W / 2);
  const hw = CARDINAL_HALF_W;
  const places = [
    [0, -(RING_R + spokeLen / 2 - ROAD_W / 4), hw * 2, spokeLen], // N (-Z)
    [0, RING_R + spokeLen / 2 - ROAD_W / 4, hw * 2, spokeLen], // S
    [RING_R + spokeLen / 2 - ROAD_W / 4, 0, spokeLen, hw * 2], // E
    [-(RING_R + spokeLen / 2 - ROAD_W / 4), 0, spokeLen, hw * 2] // W
  ];
  const fade = edgeFadeTex(); fade.channel = 1;
  const shMat = roadMat({ alphaMap: fade, transparent: true, depthWrite: false, opacity: 0.85 });
  for (const [x, z, w, d] of places) {
    const g = new THREE.PlaneGeometry(w, d); g.rotateX(-Math.PI / 2); g.translate(x, 0, z); worldUV(g, 5);
    const m = new THREE.Mesh(g, mat);
    m.position.y = 0.045; m.receiveShadow = true; scene.add(m);
    // feathered shoulder across the road width
    const ns = w < d; const pad = 3.2;
    const sg = new THREE.PlaneGeometry(ns ? w + pad : w, ns ? d : d + pad); sg.rotateX(-Math.PI / 2); sg.translate(x, 0, z); worldUV(sg, 5);
    const p = sg.attributes.position, a = new Float32Array(p.count * 2);
    for (let i = 0; i < p.count; i++) {
      const t = ns ? (p.getX(i) - x) / (w + pad) + 0.5 : (p.getZ(i) - z) / (d + pad) + 0.5;
      a[i * 2] = 0.5; a[i * 2 + 1] = t;
    }
    sg.setAttribute("uv1", new THREE.BufferAttribute(a, 2));
    const sm = new THREE.Mesh(sg, shMat); sm.position.y = 0.038; sm.receiveShadow = true; scene.add(sm);
  }
}

function plainMat(color) {
  return new THREE.MeshStandardMaterial({ color, roughness: 1 });
}

function lakeAndPlatform() {
  const water = new THREE.Mesh(
    new THREE.CircleGeometry(LAKE_R, 48),
    new THREE.MeshStandardMaterial({ color: 0x2a4a62, roughness: 0.35, metalness: 0.15 })
  );
  water.rotation.x = -Math.PI / 2;
  water.position.y = 0.02;
  scene.add(water);

  const plat = new THREE.Mesh(
    new THREE.CylinderGeometry(PLATFORM_R, PLATFORM_R + 0.8, 1.4, 32),
    plainMat(0x8a7a62)
  );
  plat.position.y = 0.7;
  plat.castShadow = true;
  plat.receiveShadow = true;
  scene.add(plat);

  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(PLATFORM_R - 0.6, 0.18, 8, 40),
    plainMat(0x9a8a70)
  );
  rim.rotation.x = Math.PI / 2;
  rim.position.y = 1.45;
  scene.add(rim);
}

function fireWall() {
  const group = new THREE.Group();
  const w = WORLD - 8;
  const base = new THREE.Mesh(
    new THREE.BoxGeometry(w, 3.2, WALL_THICK),
    new THREE.MeshStandardMaterial({ color: 0xc45a28, emissive: 0x882200, emissiveIntensity: 0.45, roughness: 0.7 })
  );
  base.position.set(0, 1.6, WALL_Y);
  group.add(base);
  const top = new THREE.Mesh(
    new THREE.BoxGeometry(w, 1.2, WALL_THICK * 0.7),
    new THREE.MeshStandardMaterial({ color: 0xe87830, emissive: 0xff4400, emissiveIntensity: 0.7, roughness: 0.55 })
  );
  top.position.set(0, 3.5, WALL_Y);
  group.add(top);
  for (let i = 0; i < 22; i++) {
    const fx = -w / 2 + 4 + i * (w / 22);
    const flame = new THREE.Mesh(
      new THREE.ConeGeometry(0.7 + (i % 3) * 0.15, 2.2 + (i % 4) * 0.35, 5),
      new THREE.MeshStandardMaterial({
        color: 0xffaa40, emissive: 0xff6600, emissiveIntensity: 1.2, transparent: true, opacity: 0.85
      })
    );
    flame.position.set(fx, 4.6 + (i % 3) * 0.3, WALL_Y);
    group.add(flame);
  }
  scene.add(group);
  const lab = makeLabel("Fire-curse wall (exit stub)", "#ffb070");
  lab.position.set(0, 6.5, WALL_Y);
  scene.add(lab);
}

function inLake(x, y) { return x * x + y * y < LAKE_R * LAKE_R; }
function inPlatform(x, y) { return x * x + y * y <= PLATFORM_R * PLATFORM_R; }
function onBridge(x, y) {
  const e = Math.abs(y) <= BRIDGE_W / 2 && x >= PLATFORM_R - 1 && x <= RING_R + 1;
  const w = Math.abs(y) <= BRIDGE_W / 2 && x <= -(PLATFORM_R - 1) && x >= -(RING_R + 1);
  return { e, w, any: e || w };
}
function inRingRoad(x, y) {
  const d = Math.hypot(x, y);
  return Math.abs(d - RING_R) <= ROAD_W / 2 + 0.5;
}
function hitNorthWall(x, y) {
  return y <= WALL_Y + WALL_THICK / 2 &&
         y >= WALL_Y - WALL_THICK / 2 - 2 &&
         Math.abs(x) <= HALF - 4;
}
function outOfBounds(x, y) {
  return Math.abs(x) > HALF - 1.5 || Math.abs(y) > HALF - 1.5;
}
function blocked(x, y) {
  if (outOfBounds(x, y)) return true;
  if (hitNorthWall(x, y)) return true;
  const br = onBridge(x, y);
  if (inPlatform(x, y) || br.any) return false;
  if (inLake(x, y)) return true;
  return false;
}
function tryMove(nx, ny) {
  let x = player.x, y = player.y;
  if (!blocked(nx, y)) x = nx;
  if (!blocked(x, ny)) y = ny;
  const samples = [
    [PLAYER_R, 0], [-PLAYER_R, 0], [0, PLAYER_R], [0, -PLAYER_R],
    [PLAYER_R * 0.7, PLAYER_R * 0.7], [-PLAYER_R * 0.7, PLAYER_R * 0.7],
    [PLAYER_R * 0.7, -PLAYER_R * 0.7], [-PLAYER_R * 0.7, -PLAYER_R * 0.7]
  ];
  for (const [ox, oy] of samples) {
    if (blocked(x + ox, y + oy)) {
      if (blocked(player.x + ox, y + oy)) y = player.y;
      if (blocked(x + ox, player.y + oy)) x = player.x;
    }
  }
  player.x = x; player.y = y;
  player.onPlatform = inPlatform(x, y);
}

function inputDir() {
  let ix = 0, iy = 0;
  if (keys.KeyW || keys.ArrowUp) iy -= 1;
  if (keys.KeyS || keys.ArrowDown) iy += 1;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;
  ix += touchVec.x; iy += touchVec.y;
  const len = Math.hypot(ix, iy);
  if (len > 1e-3) {
    const c = Math.min(1, len);
    return { x: (ix / len) * c, y: (iy / len) * c };
  }
  return { x: 0, y: 0 };
}

function nearestLandmark() {
  let best = landmarks[0], bestD = Infinity;
  for (const lm of landmarks) {
    const d = Math.hypot(player.x - lm.x, player.y - lm.y);
    if (d < bestD) { bestD = d; best = lm; }
  }
  return best;
}

function updateProgress() {
  const dLeg = Math.hypot(player.x - landmarks[1].x, player.y - landmarks[1].y);
  const dSpi = Math.hypot(player.x - landmarks[2].x, player.y - landmarks[2].y);
  const dSha = Math.hypot(player.x - landmarks[0].x, player.y - landmarks[0].y);
  if (dLeg < landmarks[1].r) progress.visitedLegendary = true;
  if (dSpi < landmarks[2].r) progress.visitedSpirit = true;
  const br = onBridge(player.x, player.y);
  if (br.e) progress.bridgeE = true;
  if (br.w) progress.bridgeW = true;
  if (player.onPlatform) progress.onPlatform = true;

  const ang = Math.atan2(player.y, player.x);
  if (inRingRoad(player.x, player.y)) {
    if (lastRingAngle !== null) {
      let d = ang - lastRingAngle;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      ringAngleAccum += d;
      if (Math.abs(ringAngleAccum) >= Math.PI * 1.7) progress.ringLap = true;
    }
    lastRingAngle = ang;
  } else lastRingAngle = null;

  if (player.y < WALL_Y + WALL_THICK + 3 && Math.abs(player.x) < 14) progress.hitWall = true;

  if (progress.visitedLegendary && progress.visitedSpirit && progress.bridgeE &&
      progress.bridgeW && progress.onPlatform && progress.hitWall && dSha < landmarks[0].r) {
    progress.returned = true;
  }
  const steps = [
    true, progress.ringLap, progress.visitedLegendary, progress.visitedSpirit,
    progress.bridgeE && progress.bridgeW && progress.onPlatform, progress.hitWall, progress.returned
  ];
  let current = 0;
  for (let i = 0; i < steps.length; i++) {
    if (!steps[i]) { current = i; break; }
    current = i;
  }
  for (let j = 0; j < scriptItems.length; j++) {
    scriptItems[j].classList.remove("done", "current");
    if (progress.returned || (steps[j] && j !== current)) scriptItems[j].classList.add("done");
    else if (j === current) scriptItems[j].classList.add("current");
  }
  if (progress.returned) {
    for (const li of scriptItems) { li.classList.remove("current"); li.classList.add("done"); }
  }
}

function drawMinimap() {
  const size = 220;
  mctx.clearRect(0, 0, size, size);
  mctx.fillStyle = "rgba(10,14,8,0.75)";
  mctx.fillRect(0, 0, size, size);
  const s = size / WORLD;
  const cx = size / 2, cy = size / 2;
  mctx.beginPath(); mctx.arc(cx, cy, LAKE_R * s, 0, Math.PI * 2);
  mctx.fillStyle = "#2a4a62"; mctx.fill();
  mctx.beginPath(); mctx.arc(cx, cy, RING_R * s, 0, Math.PI * 2);
  mctx.strokeStyle = "#6b5438"; mctx.lineWidth = Math.max(2, ROAD_W * s); mctx.stroke();
  mctx.beginPath(); mctx.arc(cx, cy, PLATFORM_R * s, 0, Math.PI * 2);
  mctx.fillStyle = "#5c4a32"; mctx.fill();
  mctx.fillStyle = "#c45a28";
  mctx.fillRect(4, cy + WALL_Y * s - 2, size - 8, 4);
  mctx.beginPath();
  mctx.arc(cx + player.x * s, cy + player.y * s, 4, 0, Math.PI * 2);
  mctx.fillStyle = "#e8f0c0"; mctx.fill();
}

function setKnob(dx, dy) {
  const max = 36, len = Math.hypot(dx, dy) || 1, c = Math.min(1, max / len);
  touchKnob.style.transform = `translate(${dx * c}px, ${dy * c}px)`;
}
let joyId = null, joyX = 0, joyY = 0;
const touchHint = document.getElementById("touch-hint");
function padPointer(e) {
  const dx = e.clientX - joyX, dy = e.clientY - joyY;
  const max = 48, len = Math.hypot(dx, dy) || 1, s = Math.min(1, max / len);
  touchVec.x = (dx / max) * s; touchVec.y = (dy / max) * s;
  setKnob(dx, dy);
}
const JOY_BLOCK = "button,a,input,select,textarea,label,#combat,#minimap,.panel";
window.addEventListener("pointerdown", (e) => {
  if (joyId !== null) return;
  if (e.pointerType === "mouse" && e.button !== 0) return;
  if (e.target.closest && e.target.closest(JOY_BLOCK)) return;
  joyId = e.pointerId; touchActive = true; joyX = e.clientX; joyY = e.clientY;
  touchPad.style.left = joyX + "px"; touchPad.style.top = joyY + "px";
  touchPad.classList.add("on"); if (touchHint) touchHint.style.opacity = "0";
  padPointer(e); e.preventDefault();
}, { passive: false });
window.addEventListener("pointermove", (e) => { if (e.pointerId === joyId) { padPointer(e); e.preventDefault(); } }, { passive: false });
function endTouch(e) {
  if (e && e.pointerId !== joyId) return;
  joyId = null; touchActive = false; touchVec.x = 0; touchVec.y = 0; setKnob(0, 0);
  touchPad.classList.remove("on"); if (touchHint) touchHint.style.opacity = "";

const loader = new GLTFLoader();
const cache = new Map();
function prep(root) {
  root.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
      if (o.material) {
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of mats) {
          if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
        }
      }
    }
  });
  return root;
}
async function ensureModel(url) {
  if (cache.has(url)) return cache.get(url);
  const gltf = await loader.loadAsync(url);
  prep(gltf.scene);
  gltf.scene.userData.clips = gltf.animations || [];
  cache.set(url, gltf.scene);
  return gltf.scene;
}
function cloneModel(url) {
  const src = cache.get(url);
  if (!src) throw new Error("Model not preloaded: " + url);
  const c = prep(SkeletonUtils.clone(src));
  c.userData.clips = src.userData.clips;
  return c;
}

// ---- Animation (KayKit Character Animations Rig_Medium + Quaternius built-in clips) ----
const mixers = [];
let rigClips = [];
async function loadRigClips() {
  const urls = ["models/anim/Rig_Medium_General.glb", "models/anim/Rig_Medium_MovementBasic.glb"];
  const res = await Promise.all(urls.map((u) => loader.loadAsync(u).catch((e) => { console.warn("anim load", u, e); return null; })));
  rigClips = res.flatMap((g) => (g ? g.animations : []));
}
function findClip(clips, names) {
  for (const n of names) {
    const c = clips.find((k) => k.name === n || k.name.endsWith("|" + n));
    if (c) return c;
  }
  return null;
}
function animate(obj, clips, names, opts = {}) {
  const clip = findClip(clips, names);
  if (!clip) return null;
  const mixer = new THREE.AnimationMixer(obj);
  const act = mixer.clipAction(clip);
  act.timeScale = opts.timeScale ?? 1;
  act.play();
  mixer.setTime(Math.random() * clip.duration);
  mixers.push(mixer);
  return { mixer, act };
}

// ---- Obstacle fade (props between camera and player go semi-transparent) ----
const occluders = [];
function addOccluder(obj, radius) {
  const box = new THREE.Box3().setFromObject(obj);
  const c = new THREE.Vector3(); box.getCenter(c);
  const sz = new THREE.Vector3(); box.getSize(sz);
  occluders.push({ obj, center: c, radius: radius ?? Math.max(1.2, Math.max(sz.x, sz.z) * 0.45), height: sz.y, faded: false, mats: null, cur: 1 });
}
function fadeMats(o) {
  if (o.mats) return o.mats;
  o.mats = [];
  o.obj.traverse((m) => {
    if (!m.isMesh || !m.material) return;
    const arr = Array.isArray(m.material) ? m.material : [m.material];
    const cl = arr.map((x) => { const y = x.clone(); y.transparent = true; y.userData.baseOpacity = x.opacity ?? 1; return y; });
    m.material = Array.isArray(m.material) ? cl : cl[0];
    o.mats.push(...cl);
  });
  return o.mats;
}
const _seg = new THREE.Vector3(), _tmp = new THREE.Vector3(), _cp = new THREE.Vector3();
function updateOcclusion(dt) {
  if (!playerMesh) return;
  const target = new THREE.Vector3(player.x, (player.onPlatform ? 1.4 : 0) + 1.0, player.y);
  const cam = camera.position;
  _seg.subVectors(target, cam);
  const len2 = _seg.lengthSq();
  for (const o of occluders) {
    if (Math.abs(o.center.x - player.x) > 45 || Math.abs(o.center.z - player.y) > 45) {
      if (o.cur >= 1) continue;
    }
    // closest point on cam->player segment to occluder axis (sample at mid height)
    _tmp.subVectors(o.center, cam);
    let t = Math.max(0, Math.min(1, _tmp.dot(_seg) / len2));
    _cp.copy(cam).addScaledVector(_seg, t);
    const dx = _cp.x - o.center.x, dz = _cp.z - o.center.z;
    const withinY = _cp.y < o.center.y + o.height * 0.5 + 0.5;
    const hit = t > 0.05 && t < 0.97 && withinY && dx * dx + dz * dz < o.radius * o.radius;
    const goal = hit ? 0.28 : 1;
    if (Math.abs(o.cur - goal) < 0.001) continue;
    o.cur += (goal - o.cur) * Math.min(1, dt * 10);
    if (Math.abs(o.cur - goal) < 0.01) o.cur = goal;
    for (const m of fadeMats(o)) { m.opacity = m.userData.baseOpacity * o.cur; m.depthWrite = o.cur > 0.99; }
  }
}
async function loadModel(url) {
  await ensureModel(url);
  return cloneModel(url);
}

function fitScale(obj, targetHeight) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = new THREE.Vector3();
  box.getSize(size);
  const h = Math.max(size.y, 0.001);
  const s = targetHeight / h;
  obj.scale.setScalar(s);
  box.setFromObject(obj);
  obj.position.y -= box.min.y;
  return obj;
}

function place(obj, x, z, rotY = 0, occlude = false) {
  obj.position.x = x;
  obj.position.z = z;
  obj.rotation.y = rotY;
  scene.add(obj);
  if (occlude) addOccluder(obj);
  return obj;
}

function clearRoadish(x, z) {
  if (inLake(x, z) || inPlatform(x, z)) return false;
  const d = Math.hypot(x, z);
  if (Math.abs(d - RING_R) < ROAD_W + 1.5) return false;
  if (Math.abs(x) < CARDINAL_HALF_W + 3 && Math.abs(z) > RING_R - 6) return false;
  if (Math.abs(z) < CARDINAL_HALF_W + 3 && Math.abs(x) > RING_R - 6) return false;
  if (Math.abs(z) < BRIDGE_W && Math.abs(x) > PLATFORM_R - 2 && Math.abs(x) < RING_R + 2) return false;
  if (z < WALL_Y + 8) return false;
  return true;
}

// Element palette (curse chain Nature→Cold→Fire→Lightning, one per biome). Darkwood = Nature.
const ELEMENT_COLORS = {
  nature: new THREE.Color(0x5be36a),
  cold: new THREE.Color(0x8fd8ff),
  fire: new THREE.Color(0xff7a2a),
  lightning: new THREE.Color(0xd8c8ff)
};
const BIOME_ELEMENT = "nature";
const ATTACK_RANGE = 2.5, ATTACK_PERIOD = 0.6, BASE_DMG = 10;
// Per-enemy-type stat gain (stat variety only; element comes from the biome)
const TYPE_GAIN = {
  beast: { stat: "hp", label: "+1 HP", amt: 1 },
  spirit: { stat: "aspd", label: "+1% atk spd", amt: 0.01 },
  bandit: { stat: "dmg", label: "+1 DMG", amt: 1 },

};
const stats = { hp: 100, aspd: 1, dmg: 0, armor: 0, kills: 0 };

const _v = new THREE.Vector3();

function regEnemy(obj, type, opts = {}) {
  const box = new THREE.Box3().setFromObject(obj);
  const h = box.max.y - box.min.y;
  const r = Math.max(0.6, Math.min(3, Math.max(box.max.x - box.min.x, box.max.z - box.min.z) * 0.4));
  const bar = document.createElement("div");
  bar.className = "hpbar"; bar.innerHTML = "<i></i>";
  const barObj = new CSS2DObject(bar);
  barObj.visible = false;
  scene.add(barObj);
  const maxHp = opts.hp ?? (opts.boss ? 260 : type === "beast" ? 40 : 30);
  enemies.push({ obj, type, boss: !!opts.boss, gain: TYPE_GAIN[opts.gainType || type], maxHp, hp: maxHp, respawn: opts.respawn ?? 20, dummy: !!opts.dummy,
    h, r, bar, fill: bar.firstChild, barObj, baseScale: obj.scale.clone(), state: "alive", t: 0, lastHit: -99 });
  const e = enemies[enemies.length - 1];
  // Pod model: fixed home, leash wander, shared per-pod respawn pool (not for bosses/dummies)
  if (opts.pod && !e.boss && !e.dummy) {
    let pod = pods.get(opts.pod.id);
    if (!pod) {
      const max = POD_POOL[type] ?? 4;
      const el = document.createElement("div"); el.className = "podcount";
      const lab = new CSS2DObject(el); lab.position.set(opts.pod.x, 2.2, opts.pod.z); lab.visible = false; scene.add(lab);
      pod = { id: opts.pod.id, x: opts.pod.x, z: opts.pod.z, type, max, left: podSave.pools[opts.pod.id] ?? max, members: [], el, lab };
      pods.set(pod.id, pod);
    }
    pod.members.push(e); e.pod = pod;
    e.walker = !!(opts.walker || obj.userData.walker);
    e.wx = obj.position.x; e.wz = obj.position.z; e.wt = Math.random() * 3;
  }
}

// ---- Pods: respawn pools by bonus tier (better bonus → fewer respawns), daily reset at local midnight ----
const POD_LEASH = 5, POD_WANDER_SPEED = 0.45, POD_RETURN_SPEED = 2.2;
const POD_POOL = { beast: 5, skeleton: 4, spirit: 3, bandit: 3 }; // +1 HP trash / +1 Armor mid / +1% ASPD best
const POD_KEY = "darkwood.pods.v1";
const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };
const pods = new Map();
let podSave = (() => { try { return JSON.parse(localStorage.getItem(POD_KEY)) || null; } catch { return null; } })();
if (!podSave || podSave.date !== todayStr()) podSave = { date: todayStr(), pools: {} };
function savePods() {
  podSave.date = todayStr(); podSave.pools = {};
  for (const p of pods.values()) podSave.pools[p.id] = p.left;
  try { localStorage.setItem(POD_KEY, JSON.stringify(podSave)); } catch {}
}
function refillPods() {
  for (const p of pods.values()) {
    p.left = p.max;
    for (const e of p.members) if (e.state === "dead") e.t = Math.max(e.t, e.respawn); // respawn now
  }
  savePods();
}
let podDayCheck = 0;
function updatePods(dt) {
  podDayCheck -= dt;
  if (podDayCheck <= 0) { podDayCheck = 5; if (podSave.date !== todayStr()) refillPods(); }
  for (const p of pods.values()) {
    const anyAlive = p.members.some((e) => e.state !== "dead");
    p.lab.visible = !anyAlive;
    if (!anyAlive) p.el.textContent = p.left > 0 ? "\u21bb " + p.left : "0 \u00b7 resets 00:00";
    for (const e of p.members) {
      if (e.state !== "alive" || e.walker) continue;
      const o = e.obj.position;
      const home = Math.hypot(o.x - p.x, o.z - p.z);
      let tx = e.wx, tz = e.wz, sp = POD_WANDER_SPEED;
      if (home > POD_LEASH) { tx = p.x; tz = p.z; sp = POD_RETURN_SPEED; e.wt = 0; }
      else {
        e.wt -= dt;
        if (e.wt <= 0) { const a = Math.random() * 6.283, r = Math.random() * (POD_LEASH - 0.5); e.wx = p.x + Math.cos(a) * r; e.wz = p.z + Math.sin(a) * r; e.wt = 4 + Math.random() * 5; }
      }
      const dx = tx - o.x, dz = tz - o.z, d = Math.hypot(dx, dz);
      if (d > 0.15) { const st = Math.min(d, sp * dt); o.x += dx / d * st; o.z += dz / d * st; if (!e.type.startsWith("spirit")) e.obj.rotation.y = Math.atan2(dx, dz); }
    }
  }
}

// ---- Particle pool: one Points, heads + 3 trail ghosts each, additive ----
const P_MAX = 1400, TRAIL = 3, P_VERTS = P_MAX * (TRAIL + 1);
const pPos = new Float32Array(P_VERTS * 3), pCol = new Float32Array(P_VERTS * 3);
const pp = { // per-particle state (struct of arrays, no allocations)
  alive: new Uint8Array(P_MAX), t: new Float32Array(P_MAX), hang: new Float32Array(P_MAX), fly: new Float32Array(P_MAX),
  x: new Float32Array(P_MAX), y: new Float32Array(P_MAX), z: new Float32Array(P_MAX),
  vx: new Float32Array(P_MAX), vy: new Float32Array(P_MAX), vz: new Float32Array(P_MAX),
  sx: new Float32Array(P_MAX), sy: new Float32Array(P_MAX), sz: new Float32Array(P_MAX),
  cx: new Float32Array(P_MAX), cy: new Float32Array(P_MAX), cz: new Float32Array(P_MAX),
  r: new Float32Array(P_MAX), g: new Float32Array(P_MAX), b: new Float32Array(P_MAX),
  burst: new Int16Array(P_MAX), hist: new Float32Array(P_MAX * TRAIL * 3)
};
for (let i = 0; i < P_VERTS; i++) pPos[i * 3 + 1] = -999;
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3).setUsage(THREE.DynamicDrawUsage));
pGeo.setAttribute("color", new THREE.BufferAttribute(pCol, 3).setUsage(THREE.DynamicDrawUsage));
pGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 1e5);
const dotTex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 32;
  const g = c.getContext("2d"), gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
  gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(0.35, "rgba(255,255,255,0.6)"); gr.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
  return new THREE.CanvasTexture(c);
})();
const pMat = new THREE.PointsMaterial({ size: 0.55, map: dotTex, vertexColors: true, transparent: true,
  depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true });
const pPoints = new THREE.Points(pGeo, pMat);
pPoints.frustumCulled = false; pPoints.renderOrder = 5;
scene.add(pPoints);

// Burst bookkeeping (fixed pool)
const BURST_MAX = 32;
const bursts = Array.from({ length: BURST_MAX }, () => ({ used: false, left: 0, first: true, boss: false, gain: null }));
let pCursor = 0;

function spawnAbsorb(x, y, z, gain, boss) {
  let bi = bursts.findIndex((b) => !b.used);
  if (bi < 0) bi = 0;
  const B = bursts[bi];
  const n = boss ? 120 : 24 + ((Math.random() * 17) | 0);
  B.used = true; B.left = n; B.first = true; B.boss = boss; B.gain = gain;
  const col = ELEMENT_COLORS[BIOME_ELEMENT];
  for (let k = 0; k < n; k++) {
    let i = -1;
    for (let s = 0; s < P_MAX; s++) { const j = (pCursor + s) % P_MAX; if (!pp.alive[j]) { i = j; break; } }
    if (i < 0) { B.left--; continue; }
    pCursor = (i + 1) % P_MAX;
    pp.alive[i] = 1; pp.t[i] = 0; pp.burst[i] = bi;
    pp.hang[i] = (boss ? 0.75 : 0.3) + Math.random() * 0.12;
    pp.fly[i] = (boss ? 1.3 : 0.55) + Math.random() * (boss ? 0.6 : 0.25);
    pp.x[i] = x + (Math.random() - 0.5) * 0.6; pp.y[i] = y + Math.random() * (boss ? 2.5 : 1.2); pp.z[i] = z + (Math.random() - 0.5) * 0.6;
    const a = Math.random() * Math.PI * 2, sp = (boss ? 6 : 4) * (0.5 + Math.random());
    pp.vx[i] = Math.cos(a) * sp; pp.vz[i] = Math.sin(a) * sp; pp.vy[i] = 1.5 + Math.random() * (boss ? 5 : 3);
    const j = 0.75 + Math.random() * 0.5;
    pp.r[i] = Math.min(1, col.r * j); pp.g[i] = Math.min(1, col.g * j); pp.b[i] = Math.min(1, col.b * j);
    for (let h = 0; h < TRAIL; h++) { const o = (i * TRAIL + h) * 3; pp.hist[o] = pp.x[i]; pp.hist[o + 1] = pp.y[i]; pp.hist[o + 2] = pp.z[i]; }
  }
  if (B.left <= 0) B.used = false;
}

function updateParticles(dt, px, py, pz) {
  for (let i = 0; i < P_MAX; i++) {
    const head = i * (TRAIL + 1) * 3;
    if (!pp.alive[i]) { if (pPos[head + 1] !== -999) for (let h = 0; h <= TRAIL; h++) pPos[head + h * 3 + 1] = -999; continue; }
    pp.t[i] += dt;
    const t = pp.t[i], hang = pp.hang[i];
    // shift trail history
    const ho = i * TRAIL * 3;
    for (let h = TRAIL - 1; h > 0; h--) { pp.hist[ho + h * 3] = pp.hist[ho + (h - 1) * 3]; pp.hist[ho + h * 3 + 1] = pp.hist[ho + (h - 1) * 3 + 1]; pp.hist[ho + h * 3 + 2] = pp.hist[ho + (h - 1) * 3 + 2]; }
    pp.hist[ho] = pp.x[i]; pp.hist[ho + 1] = pp.y[i]; pp.hist[ho + 2] = pp.z[i];
    if (t < hang) {
      const damp = Math.exp(-4.5 * dt);
      pp.vx[i] *= damp; pp.vy[i] = pp.vy[i] * damp - 2.0 * dt; pp.vz[i] *= damp;
      pp.x[i] += pp.vx[i] * dt; pp.y[i] += pp.vy[i] * dt; pp.z[i] += pp.vz[i] * dt;
      if (t + dt >= hang) { // freeze bezier start + control (outward + up)
        pp.sx[i] = pp.x[i]; pp.sy[i] = pp.y[i]; pp.sz[i] = pp.z[i];
        pp.cx[i] = pp.x[i] + pp.vx[i] * 2.5 + (Math.random() - 0.5) * 3; pp.cy[i] = pp.y[i] + 2.5 + Math.random() * 2; pp.cz[i] = pp.z[i] + pp.vz[i] * 2.5 + (Math.random() - 0.5) * 3;
      }
    } else {
      let u = (t - hang) / pp.fly[i];
      if (u >= 1) { pp.alive[i] = 0; onArrive(pp.burst[i]); continue; }
      u = u * u * (3 - 2 * u) * 0.35 + u * u * 0.65; // ease-in toward player
      const a = (1 - u) * (1 - u), b = 2 * (1 - u) * u, c = u * u;
      pp.x[i] = a * pp.sx[i] + b * pp.cx[i] + c * px;
      pp.y[i] = a * pp.sy[i] + b * pp.cy[i] + c * py;
      pp.z[i] = a * pp.sz[i] + b * pp.cz[i] + c * pz;
    }
    pPos[head] = pp.x[i]; pPos[head + 1] = pp.y[i]; pPos[head + 2] = pp.z[i];
    pCol[head] = pp.r[i]; pCol[head + 1] = pp.g[i]; pCol[head + 2] = pp.b[i];
    for (let h = 0; h < TRAIL; h++) {
      const o = head + (h + 1) * 3, f = 0.55 / (h + 1.4);
      pPos[o] = pp.hist[ho + h * 3]; pPos[o + 1] = pp.hist[ho + h * 3 + 1]; pPos[o + 2] = pp.hist[ho + h * 3 + 2];
      pCol[o] = pp.r[i] * f; pCol[o + 1] = pp.g[i] * f; pCol[o + 2] = pp.b[i] * f;
    }
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
}

// ---- Player pulse ring ----
const ringMat = new THREE.MeshBasicMaterial({ color: ELEMENT_COLORS[BIOME_ELEMENT], transparent: true, opacity: 0,
  blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
const ring = new THREE.Mesh(new THREE.RingGeometry(0.75, 1.0, 40), ringMat);
ring.rotation.x = -Math.PI / 2; ring.renderOrder = 6;
scene.add(ring);
const glow = new THREE.PointLight(ELEMENT_COLORS[BIOME_ELEMENT], 0, 8, 2);
scene.add(glow);
const pulse = { t: 1, dur: 0.45, big: false };
function triggerPulse(big) { pulse.t = 0; pulse.dur = big ? 0.9 : 0.4; pulse.big = big; }
function updatePulse(dt, px, py, pz) {
  pulse.t += dt;
  const k = Math.min(1, pulse.t / pulse.dur);
  const s = (pulse.big ? 1 + k * 4.5 : 1 + k * 1.8);
  ring.scale.set(s, s, s);
  ring.position.set(px, py + 0.08, pz);
  ringMat.opacity = k >= 1 ? 0 : (1 - k) * (pulse.big ? 1 : 0.85);
  glow.position.set(px, py + 1.2, pz);
  glow.intensity = k >= 1 ? 0 : (1 - k) * (pulse.big ? 6 : 2.5);
}

function onArrive(bi) {
  const B = bursts[bi];
  if (!B.used) return;
  if (B.first) {
    B.first = false;
    triggerPulse(B.boss);
    if (B.gain) {
      const amt = B.boss ? B.gain.amt * 10 : B.gain.amt;
      stats[B.gain.stat] += amt;
      const lab = B.boss ? B.gain.label.replace("+1", "+10") : B.gain.label;
      floatText(_v.set(player.x, playerY() + 2.6, player.y), lab, B.boss ? "gain boss" : "gain");
      updateStatsHud();
    }
  } else if (B.boss && B.left % 30 === 0) triggerPulse(true);
  if (--B.left <= 0) B.used = false;
}

// ---- Floating text pool (CSS2D) ----
const FT_MAX = 24;
const fts = Array.from({ length: FT_MAX }, () => {
  const el = document.createElement("div"); el.className = "ftxt";
  const o = new CSS2DObject(el); o.visible = false; scene.add(o);
  return { o, el, t: 9, vy: 0 };
});
let ftCursor = 0;
function floatText(pos, text, cls) {
  const f = fts[ftCursor]; ftCursor = (ftCursor + 1) % FT_MAX;
  f.el.textContent = text; f.el.className = "ftxt " + cls;
  f.o.position.copy(pos); f.o.position.x += (Math.random() - 0.5) * 0.6;
  f.t = 0; f.vy = cls.startsWith("gain") ? 1.0 : 1.6; f.o.visible = true;
}
function updateFloatText(dt) {
  for (const f of fts) {
    if (!f.o.visible) continue;
    f.t += dt; f.o.position.y += f.vy * dt;
    const life = f.el.className.includes("boss") ? 1.8 : 0.9;
    f.el.style.opacity = String(Math.max(0, 1 - f.t / life));
    if (f.t >= life) f.o.visible = false;
  }
}

function playerY() { return player.onPlatform ? 1.4 : 0; }

function killEnemy(e, forceBoss) {
  e.state = "dying"; if (e.dummy) { e.diedAt = elapsedReal; e.diedWall = performance.now(); } e.t = 0; e.barObj.visible = false;
  stats.kills++;
  const p = e.obj.position;
  spawnAbsorb(p.x, p.y + e.h * 0.4, p.z, e.gain, forceBoss || e.boss);
}

function doAttack() {
  const dmg = BASE_DMG + stats.dmg;
  let hit = false;
  for (const e of enemies) {
    if (e.state !== "alive") continue;
    const d = Math.hypot(e.obj.position.x - player.x, e.obj.position.z - player.y);
    if (d > ATTACK_RANGE + e.r) continue;
    hit = true;
    e.hp -= dmg; e.lastHit = elapsedReal;
    floatText(_v.set(e.obj.position.x, e.obj.position.y + e.h + 0.4, e.obj.position.z), String(dmg), "dmg");
    if (e.hp <= 0) killEnemy(e);
  }
  return hit;
}

let elapsedReal = 0;
function updateCombat(dt) {
  elapsedReal += dt;
  attackTimer -= dt;
  const period = ATTACK_PERIOD / stats.aspd;
  if (attackTimer <= 0) { doAttack(); attackTimer = period; }
  for (const e of enemies) {
    if (e.state === "alive") {
      const show = e.hp < e.maxHp && elapsedReal - e.lastHit < 6;
      e.barObj.visible = show;
      if (show) {
        e.barObj.position.set(e.obj.position.x, e.obj.position.y + e.h + 0.3, e.obj.position.z);
        e.fill.style.width = Math.max(0, (e.hp / e.maxHp) * 100).toFixed(0) + "%";
      }
    } else if (e.state === "dying") {
      e.t += dt;
      const k = Math.min(1, e.t / (e.boss ? 0.7 : 0.35));
      const s = 1 - k * k;
      e.obj.scale.set(e.baseScale.x * s, e.baseScale.y * s, e.baseScale.z * s);
      if (k >= 1) { e.obj.visible = false; e.state = "dead"; e.t = 0; }
    } else if (e.state === "dead") {
      e.t += dt;
      if (e.pod && e.t >= e.respawn && e.pod.left <= 0) continue; // pool empty until daily reset
      if (e.t >= (e.dummy ? e.respawn - 0.35 : e.respawn)) { if (e.pod) { e.pod.left--; savePods(); e.obj.position.x = e.pod.x + (Math.random() - 0.5) * 3; e.obj.position.z = e.pod.z + (Math.random() - 0.5) * 3; } if (e.dummy) (window.__dummyRespawnMs ||= []).push({ game: +(elapsedReal - e.diedAt).toFixed(3), wall: Math.round(performance.now() - e.diedWall) }); e.state = "alive"; e.hp = e.maxHp; e.obj.visible = true; e.obj.scale.copy(e.baseScale); }
    }
  }
}

function bossTest() {
  const a = player.facing;
  spawnAbsorb(player.x + Math.sin(a) * 6, playerY() + 1, player.y + Math.cos(a) * 6, TYPE_GAIN.bandit, true);
}

const statsHudEl = document.getElementById("pstats");
function updateStatsHud() {
  statsHudEl.textContent = `HP ${stats.hp} · DMG ${BASE_DMG + stats.dmg} · ASPD ${(stats.aspd * 100).toFixed(0)}% · ARM ${stats.armor} · kills ${stats.kills}`;
}
document.getElementById("btn-boss").addEventListener("click", bossTest);
window.addEventListener("keydown", (e) => {
  if (e.code === "KeyB") bossTest();
});
updateStatsHud();
window.__dw = { stats, enemies, pods, refillPods, bossTest, doAttack, spawnAbsorb, player, WALK_SPEED };
// ===================== end kill prototype =====================

function updateCamera() {
  const target = new THREE.Vector3(player.x, player.onPlatform ? 1.4 : 0, player.y);
  const desired = target.clone().add(camOffset);
  camera.position.lerp(desired, 0.12);
  camera.lookAt(target.x, target.y + 1.2, target.z);
}

function frame(ts) {
  if (!lastTs) lastTs = ts;
  const dt = Math.min(0.05, (ts - lastTs) / 1000);
  lastTs = ts;

  const dir = inputDir();
  const moving = Math.hypot(dir.x, dir.y) > 0;
  if (playerAnim && playerAnim.idle && playerAnim.walk && moving !== playerAnim.moving) {
    playerAnim.moving = moving;
    const from = moving ? playerAnim.idle : playerAnim.walk, to = moving ? playerAnim.walk : playerAnim.idle;
    to.reset().setEffectiveWeight(1).play();
    from.crossFadeTo(to, 0.2, false);
  }
  if (moving) {
    elapsed += dt;
    const speed = WALK_SPEED * (player.onPlatform ? 0.92 : 1);
    tryMove(player.x + dir.x * speed * dt, player.y + dir.y * speed * dt);
    player.facing = Math.atan2(dir.x, dir.y);
  }
  timerEl.textContent = elapsed.toFixed(1) + "s";
  nearestEl.textContent = nearestLandmark().label;
  updateProgress();

  if (playerMesh) {
    playerMesh.position.set(player.x, player.onPlatform ? 1.4 : 0, player.y);
    // ground snap already in fitScale; raise on platform
    const box = new THREE.Box3().setFromObject(playerMesh);
    // keep feet on platform top roughly
    playerMesh.position.y = player.onPlatform ? 1.4 : 0;
    playerMesh.rotation.y = player.facing;
  }

  for (const b of bobbers) {
    const amp = b.amp ?? 0.45;
    b.obj.position.y = b.baseY + Math.sin(ts * 0.002 + b.phase) * amp;
    b.obj.rotation.y += dt * 0.35;
  }
  for (const w of walkers) {
    w.ang += dt * w.speed;
    const nx = w.cx + Math.cos(w.ang) * w.r, nz = w.cz + Math.sin(w.ang) * w.r;
    w.obj.rotation.y = Math.atan2(nx - w.obj.position.x, nz - w.obj.position.z);
    w.obj.position.x = nx; w.obj.position.z = nz;
  }
  for (const m of mixers) m.update(dt);
  fireLight.intensity = 2.0 + Math.sin(ts * 0.006) * 0.5;

  updateCamera();
  updateOcclusion(dt);
  updateCombat(dt);
  updatePods(dt);
  updateParticles(dt, player.x, playerY() + 1.1, player.y);
  updatePulse(dt, player.x, playerY(), player.y);
  updateFloatText(dt);
  drawMinimap();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(frame);
}

loadEl.textContent = "Dressing Darkwood…";
dressScene()
  .then(() => {
    loadEl.classList.add("hide");
    requestAnimationFrame(frame);
  })
  .catch((err) => {
    console.error(err);
    loadEl.textContent = "Load failed — use npx serve (modules need http). " + (err && err.message ? err.message : err);
  });
  </script>
</body>
